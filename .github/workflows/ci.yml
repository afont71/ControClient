name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ControClient.sln

      - name: Build
        run: dotnet build ControClient.sln --no-restore -c Release

      - name: Tests
        run: dotnet run --project tests/ControClient.Tests -c Release --no-build
